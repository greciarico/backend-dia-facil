spring.application.name=backend

# No generar esquema fuera del perfil local.
spring.jpa.hibernate.ddl-auto=none
# Preserve existing UNIQUE constraints during update; runtime seeding verifies its required keys.
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY

# Functional system data; explicitly disable to inspect/transition an existing schema.
diafacil.datos-base.enabled=true

# No ejecutar scripts SQL automaticamente.
spring.sql.init.mode=never

# Hibernate gestionara el esquema en esta etapa.
spring.flyway.enabled=false

# Valores compartidos de correo; SMTP se configura por entorno.
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# El modulo de autenticacion requiere activacion y secretos privados explicitos.
diafacil.auth.enabled=false
diafacil.auth.zone=America/Lima
diafacil.auth.session.access=PT15M
diafacil.auth.session.idle=P30D
diafacil.auth.session.absolute=P90D
