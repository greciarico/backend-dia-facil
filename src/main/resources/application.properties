spring.application.name=backend

# No generar esquema fuera del perfil local.
spring.jpa.hibernate.ddl-auto=none

# No ejecutar scripts SQL automaticamente.
spring.sql.init.mode=never

# Hibernate gestionara el esquema en esta etapa.
spring.flyway.enabled=false

# Valores compartidos de correo; SMTP se configura por entorno.
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# El modulo de autenticacion requiere activacion y secretos privados explicitos.
diafacil.auth.enabled=false
diafacil.auth.zone=America/Lima
