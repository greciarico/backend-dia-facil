# Copiar como application-local.properties en esta misma carpeta.
# Completar las credenciales unicamente en la copia local.

spring.datasource.url=jdbc:mysql://localhost:3306/diafacil?createDatabaseIfNotExist=true
spring.datasource.username=REEMPLAZAR_USUARIO_MYSQL
spring.datasource.password=REEMPLAZAR_PASSWORD_MYSQL

# Exclusivamente para desarrollo local.
spring.jpa.hibernate.ddl-auto=update

# E3 local: verifica esquema y ausencia de códigos legacy antes de admitir vinculaciones.
# Consultar docs/dispositivos-e3.md antes de activar sobre una BD existente.
diafacil.dispositivos.enabled=true

# Gmail SMTP local. Credenciales suministradas al proceso mediante variables de entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${DIAFACIL_GMAIL_USERNAME}
spring.mail.password=${DIAFACIL_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
diafacil.mail.from=${spring.mail.username}

# Plantilla sin secretos reales; la copia privada puede guardar valores Base64 directamente.
diafacil.auth.enabled=true
diafacil.auth.otp-secret=${DIAFACIL_AUTH_OTP_SECRET}
diafacil.auth.registration-secret=${DIAFACIL_AUTH_REGISTRATION_SECRET}
